name: Release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to receive package assets
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.event.release.tag_name }}

jobs:
  release:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check selected release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null

  debian:
    needs: release
    strategy:
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: debian:trixie-slim
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential debhelper dpkg-dev git perl
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      - name: Check release version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(dpkg-parsechangelog -SVersion)
          test "${RELEASE_TAG#v}" = "${version%%-*}"
          git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null
      - name: Build Debian packages
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.architecture }}"
          mkdir -p build/debian/source
          git archive "$RELEASE_TAG" | tar -x -C build/debian/source
          rm -rf build/debian/source/debian
          cp -a debian build/debian/source/
          cd build/debian/source
          DEB_BUILD_OPTIONS="parallel=$(nproc)" \
            dpkg-buildpackage --build=binary --no-sign
          mkdir ../../../artifacts
          cp ../*.deb ../../../artifacts/
          for package in ../../../artifacts/*.deb; do
            test "$(dpkg-deb -f "$package" Architecture)" = \
              "${{ matrix.architecture }}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: debian-packages-${{ matrix.architecture }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 1

  rpm:
    needs: release
    runs-on: ubuntu-24.04
    container: rockylinux:9
    steps:
      - name: Install dependencies
        run: >-
          dnf install -y
          diffutils file findutils gcc git gnupg2 gzip make perl
          perl-generators rpm-build rpm-sign tar
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      - name: Check release version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          version=$(rpm --specfile -q --qf '%{VERSION}\n' \
            packaging/rpm/krb5keytab.spec | head -1)
          test "${RELEASE_TAG#v}" = "$version"
          git rev-parse --verify "$RELEASE_TAG^{commit}" >/dev/null
      - name: Build RPM packages
        run: |
          . /etc/os-release
          test "${VERSION_ID%%.*}" = 9
          test "$(uname -m)" = x86_64
          version=$(rpm --specfile -q --qf '%{VERSION}\n' \
            packaging/rpm/krb5keytab.spec | head -1)
          mkdir -p "$HOME/rpmbuild/SOURCES"
          git archive --prefix="krb5_keytab-$version/" "$RELEASE_TAG" |
            gzip -n >"$HOME/rpmbuild/SOURCES/krb5_keytab-$version.tar.gz"
          rpmbuild -ba packaging/rpm/krb5keytab.spec
          mkdir artifacts
          cp "$HOME"/rpmbuild/RPMS/*/*.rpm artifacts/
          cp "$HOME"/rpmbuild/SRPMS/*.src.rpm artifacts/
          for package in artifacts/*.rpm; do
            case "$package" in
              *.src.rpm) ;;
              *) test "$(rpm -qp --qf '%{ARCH}' "$package")" = x86_64 ;;
            esac
          done
      - name: Sign RPM packages
        env:
          RPM_SIGNING_KEY: ${{ secrets.ARCHIVE_SIGNING_KEY }}
          RPM_SIGNING_FINGERPRINT: ${{ vars.ARCHIVE_SIGNING_FINGERPRINT }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.ARCHIVE_SIGNING_PASSPHRASE }}
        run: .github/scripts/sign-rpms artifacts/*.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-packages
          path: artifacts/*.rpm
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [debian, rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "$RELEASE_TAG" artifacts/*
          --repo "$GITHUB_REPOSITORY" --clobber
      - name: Notify package repository
        env:
          GH_TOKEN: ${{ secrets.PKGS_DISPATCH_TOKEN }}
        run: >-
          gh api --method POST repos/ChapelTech/pkgs/dispatches
          -f event_type=package-release
          -f "client_payload[repository]=$GITHUB_REPOSITORY"
          -f "client_payload[tag]=$RELEASE_TAG"
